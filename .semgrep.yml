# Semgrep rulesets for local SAST scans (optional; not wired in GitHub Actions).
# Semgrep GitHub App removed — run manually when needed.
# Secrets: covered by Gitleaks in security.yml (p/secrets omitted here).

rules: []

# Active rulesets:
#   p/typescript    — TypeScript anti-patterns
#   p/nodejs        — Node.js security (injection, traversal, etc.)
#   p/owasp-top-ten — OWASP Top 10
#   p/react         — React-specific issues (XSS, etc.)
#
# Local scan (PR diff vs main):
#   semgrep scan --config p/typescript --config p/nodejs \
#     --config p/owasp-top-ten --config p/react \
#     --baseline-commit origin/main --json .
