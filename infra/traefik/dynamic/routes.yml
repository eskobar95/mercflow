# Traefik dynamic routes (T027). Update hostnames when DOMAIN changes.
http:
  routers:
    medusa:
      rule: Host(`api.mercflow.shop`)
      entryPoints:
        - websecure
      service: medusa
      tls:
        certResolver: letsencrypt
    grafana:
      rule: Host(`grafana.mercflow.shop`)
      entryPoints:
        - websecure
      service: grafana
      tls:
        certResolver: letsencrypt
    portainer:
      rule: Host(`portainer.mercflow.shop`)
      entryPoints:
        - websecure
      service: portainer
      tls:
        certResolver: letsencrypt
  services:
    medusa:
      loadBalancer:
        servers:
          - url: http://medusa-backend:9000
    grafana:
      loadBalancer:
        servers:
          - url: http://grafana:3000
    portainer:
      loadBalancer:
        servers:
          - url: http://portainer:9000
