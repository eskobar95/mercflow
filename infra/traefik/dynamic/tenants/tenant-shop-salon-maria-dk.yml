# MercFlow tenant route (T030). Domain: shop.salon-maria.dk
# Storefront + public APIs on tenant host. /app and /admin redirect to platform admin (api.mercflow.shop).
http:
  middlewares:
    tenant-shop-salon-maria-dk-redirect-admin:
      redirectRegex:
        permanent: true
        regex: "^https://shop\\.salon-maria\\.dk/(app|admin).*"
        replacement: "https://api.mercflow.shop/app"
  routers:
    tenant-shop-salon-maria-dk-admin:
      rule: Host(`shop.salon-maria.dk`) && (PathPrefix(`/app`) || PathPrefix(`/admin`))
      priority: 200
      entryPoints:
        - websecure
      middlewares:
        - tenant-shop-salon-maria-dk-redirect-admin
      service: tenant-shop-salon-maria-dk
      tls:
        certResolver: letsencrypt
    tenant-shop-salon-maria-dk:
      rule: Host(`shop.salon-maria.dk`)
      priority: 1
      entryPoints:
        - websecure
      service: tenant-shop-salon-maria-dk
      tls:
        certResolver: letsencrypt
  services:
    tenant-shop-salon-maria-dk:
      loadBalancer:
        servers:
          - url: http://medusa-backend:9000
