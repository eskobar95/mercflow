# MercFlow tenant route (T030). Domain: test.mercflow.shop
# Storefront + public APIs on tenant host. /app and /admin redirect to platform admin (localhost:9000).
http:
  middlewares:
    tenant-test-mercflow-shop-redirect-admin:
      redirectRegex:
        permanent: true
        regex: "^https://test\.mercflow\.shop/(app|admin).*"
        replacement: "https://localhost:9000/app"
  routers:
    tenant-test-mercflow-shop-admin:
      rule: Host(`test.mercflow.shop`) && (PathPrefix(`/app`) || PathPrefix(`/admin`))
      priority: 200
      entryPoints:
        - websecure
      middlewares:
        - tenant-test-mercflow-shop-redirect-admin
      service: tenant-test-mercflow-shop
      tls:
        certResolver: letsencrypt
    tenant-test-mercflow-shop:
      rule: Host(`test.mercflow.shop`)
      priority: 1
      entryPoints:
        - websecure
      service: tenant-test-mercflow-shop
      tls:
        certResolver: letsencrypt
  services:
    tenant-test-mercflow-shop:
      loadBalancer:
        servers:
          - url: http://medusa-backend:9000
