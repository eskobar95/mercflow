server {
    listen 8080;
    server_name _;

    # Vite build uses base /app/ — static files live under dist/ without an app/ prefix on disk.
    location /app/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /app/index.html;
    }

    location = /app {
        return 301 /app/;
    }
}
