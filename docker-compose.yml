# Local development only. Do not use these defaults in production.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mercflow-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: mercflow
      POSTGRES_PASSWORD: mercflow_dev
      POSTGRES_DB: mercflow
    ports:
      - "5432:5432"
    volumes:
      - mercflow_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercflow -d mercflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mercflow_pgdata_dev:
