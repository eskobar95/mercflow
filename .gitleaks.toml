# Gitleaks configuration for MercFlow
# Docs: https://github.com/gitleaks/gitleaks

title = "MercFlow Gitleaks Config"

[extend]
# Extend the default ruleset
useDefault = true

[allowlist]
description = "MercFlow allowlist"
paths = [
  # Never scan these paths for secrets
  '''pnpm-lock.yaml''',
  '''\.github/workflows/''',
]
regexes = [
  # Medusa's placeholder secrets used in docs and test fixtures
  '''COOKIE_SECRET=supersecret''',
  '''JWT_SECRET=supersecret''',
  # Design token hex values are not secrets
  '''#[0-9a-fA-F]{3,8}''',
]

[[rules]]
id = "mercflow-env-file"
description = "Prevent .env files with real values from being committed"
regex = '''(?i)(DATABASE_URL|JWT_SECRET|COOKIE_SECRET|STRIPE_SECRET|POSTMARK_API_KEY|CLOUDINARY_SECRET)\s*=\s*[^\$\{][^\n]{8,}'''
paths = ['''\.env$''', '''\.env\.local$''', '''\.env\.production$''']
severity = "CRITICAL"
tags = ["mercflow", "env"]
