# Gitleaks configuration for MercFlow
# Docs: https://github.com/gitleaks/gitleaks

title = "MercFlow Gitleaks Config"

[extend]
# Extend the default ruleset
useDefault = true

[allowlist]
description = "MercFlow allowlist"
paths = [
  # Never scan these paths for secrets
  '''pnpm-lock.yaml''',
  '''\.github/workflows/''',
  # Env templates — variable names only, no real credentials
  '''\.env\.example$''',
  # Provision-tenant CLI docs and password alphabet (no real secrets)
  '''scripts/provision-tenant/''',
  '''infra/RUNBOOK\.md''',
  # Package README migration examples (documented env var names, not real values)
  '''packages/subscription-module/README\.md''',
]
regexes = [
  # Medusa's placeholder secrets used in docs and test fixtures
  '''COOKIE_SECRET=supersecret''',
  '''JWT_SECRET=supersecret''',
  # Design token hex values are not secrets
  '''#[0-9a-fA-F]{3,8}''',
  # Sequential hex test fixtures (e.g. 0123456789abcdef... used in encryption unit tests)
  '''0123456789abcdef0123456789abcdef''',
  # Test fixture variables: const TEST_*_KEY, TEST_HEX_KEY etc. in test files
  '''const TEST_[A-Z_]+ =''',
]

[[rules]]
id = "mercflow-env-file"
description = "Prevent .env files with real values from being committed"
regex = '''(?i)(DATABASE_URL|JWT_SECRET|COOKIE_SECRET|STRIPE_SECRET|POSTMARK_API_KEY|CLOUDINARY_SECRET)\s*=\s*[^\$\{][^\n]{8,}'''
paths = ['''\.env$''', '''\.env\.local$''', '''\.env\.production$''']
severity = "CRITICAL"
tags = ["mercflow", "env"]

