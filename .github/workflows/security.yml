name: Security

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Dependency CVE review — flags new vulnerable packages introduced in this PR
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-review:
    name: Dependency review (new CVEs)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # Allow known false positives here if needed:
          # allow-ghsas: GHSA-xxxx-xxxx-xxxx

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. pnpm audit — blocks on HIGH/CRITICAL CVEs in lockfile
  # ─────────────────────────────────────────────────────────────────────────────
  audit:
    name: pnpm audit (CVE lockfile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (fail on HIGH+)
        run: |
          # Run audit and capture JSON output; exit code may be non-zero.
          pnpm audit --audit-level=high --json > /tmp/audit.json 2>/dev/null || true

          node - <<'EOF'
          const fs = require('fs');
          // GHSAs accepted as non-actionable in this project (documented reason required).
          const ALLOWED = new Set([
            // vitest UI server arbitrary file read (GHSA-5xrq-8626-4rwp):
            // Only exploitable when `vitest --ui` server is running and network-accessible.
            // MercFlow never runs vitest --ui in CI or production; uses `vitest run` only.
            // Track: upgrade vitest to >=4.1.0 once vite@6 migration is complete.
            'GHSA-5xrq-8626-4rwp',
          ]);

          let audit;
          try {
            audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          } catch {
            console.error('pnpm audit did not produce valid JSON');
            process.exit(1);
          }

          const HIGH = new Set(['high', 'critical']);
          const advisories = Object.values(audit.advisories ?? {});
          const blocking = advisories.filter(
            (a) => HIGH.has(a.severity) && !ALLOWED.has(a.github_advisory_id)
          );

          if (blocking.length === 0) {
            const skipped = advisories.filter(
              (a) => HIGH.has(a.severity) && ALLOWED.has(a.github_advisory_id)
            );
            if (skipped.length) {
              console.log(
                `audit: ${skipped.length} allowed HIGH/CRITICAL (see ALLOWED list): ` +
                  skipped.map((a) => a.github_advisory_id).join(', ')
              );
            }
            console.log('pnpm audit passed.');
            process.exit(0);
          }

          blocking.forEach((a) =>
            console.error(
              `BLOCKING ${a.severity.toUpperCase()}: ${a.title} (${a.github_advisory_id})`
            )
          );
          process.exit(1);
          EOF

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Gitleaks — detect secrets and credentials committed to the repo
  # ─────────────────────────────────────────────────────────────────────────────
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Semgrep SAST runs via the installed Semgrep GitHub App — not in this workflow.
  # Configure rules in .semgrep.yml at repo root.

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. react-doctor — React code quality, performance, security, a11y, dead code
  #    Scans only files changed in this PR (--diff) for fast feedback.
  # ─────────────────────────────────────────────────────────────────────────────
  react-doctor:
    name: React Doctor (admin-ui)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: React Doctor (changed files only)
        working-directory: packages/admin-ui
        run: >
          npx react-doctor
          --diff origin/development
          --annotations
          --fail-on error
        continue-on-error: false
