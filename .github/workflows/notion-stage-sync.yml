name: Notion Stage Sync

# Bridges GitHub events → Notion Stage changes.
#
# Replaces the never-deployed github-events Notion Worker.
#
# Handles:
#   1. workflow_run failure on CI / Security   → Stage: Fix
#      NOTE: check_run events from GitHub Actions cannot trigger other GitHub
#      Actions workflows (GitHub anti-loop guard). workflow_run is the correct
#      trigger for responding to GitHub Actions CI failures.
#   2. Bugbot review with findings             → Stage: Fix
#   3. Bugbot review with no findings          → Stage: Ready for Merge
#   4. schedule (cron)                         → fallback scan for stuck PRs

on:
  workflow_run:
    workflows: ["CI", "Security", "Conduro CI"]
    types: [completed]
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pull-requests: read

# ─────────────────────────────────────────────────────────────────────────────
# Shared bash helper — extracts Notion page ID from a PR body and calls the
# Notion API. Inlined in each job since GitHub Actions has no shared steps.
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. CI failure → Stage: Fix ─────────────────────────────────────────────
  # Triggers when the "CI" or "Security" GitHub Actions workflow completes with
  # failure. We use workflow_run (not check_run) because GitHub Actions blocks
  # check_run events created by GitHub Actions itself — they never fire here.
  ci-failure-fix:
    name: Stage → Fix on CI/Security failure
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Set Stage → Fix
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(echo '${{ toJson(github.event.workflow_run.pull_requests) }}' \
            | jq -r '.[0].number // empty')
          [ -z "$PR_NUMBER" ] && echo "No PR in workflow_run event — skipping." && exit 0

          PR_BODY=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json body -q .body)
          NOTION_URL=$(echo "$PR_BODY" | grep -oP 'https://www\.notion\.so/[a-zA-Z0-9/_-]+' | head -1 || true)
          [ -z "$NOTION_URL" ] && echo "No Notion URL in PR body — skipping." && exit 0

          HEX=$(echo "$NOTION_URL" | grep -oP '[0-9a-f]{32}' | tail -1)
          PAGE_ID="${HEX:0:8}-${HEX:8:4}-${HEX:12:4}-${HEX:16:4}-${HEX:20}"

          # Fetch failing jobs with their IDs
          FAILING_JOBS_JSON=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" \
            --jq '[.jobs[] | select(.conclusion == "failure") | {name: .name, id: .id}]' \
            2>/dev/null || echo "[]")
          FAILING_JOBS=$(echo "$FAILING_JOBS_JSON" | jq -r '[.[].name] | join(", ")' || echo "unknown")

          # For each failing job, fetch log and extract actionable error lines.
          # React Doctor, TypeScript, ESLint and similar tools emit structured output
          # that we pass verbatim so the implementation agent knows exactly what to fix.
          REVIEW_CONTEXT=""
          while IFS= read -r JOB; do
            JOB_NAME=$(echo "$JOB" | jq -r '.name')
            JOB_ID=$(echo "$JOB"  | jq -r '.id')

            # Download the job log (GitHub returns a redirect to a zip; use --location)
            JOB_LOG=$(gh api "repos/${{ github.repository }}/actions/jobs/${JOB_ID}/logs" \
              --accept application/vnd.github.v3.raw 2>/dev/null | head -c 32000 || echo "")

            # Extract actionable lines: ##[error], ##[warning], file:line patterns,
            # React Doctor rules, TypeScript errors, ESLint violations.
            EXTRACTED=$(echo "$JOB_LOG" | grep -E \
              '##\[error\]|##\[warning\]|\.(ts|tsx):[0-9]+|error TS[0-9]+|State reset|Unused (file|type)|Duplicate export|Missing key|react-hooks/' \
              | head -40 || echo "")

            if [ -n "$EXTRACTED" ]; then
              REVIEW_CONTEXT=$(printf '%s=== %s ===\n%s\n\n' "$REVIEW_CONTEXT" "$JOB_NAME" "$EXTRACTED")
            fi
          done < <(echo "$FAILING_JOBS_JSON" | jq -c '.[]')

          # Fall back to job names only if no structured errors were extracted
          if [ -z "$REVIEW_CONTEXT" ]; then
            REVIEW_CONTEXT="Failing jobs: ${FAILING_JOBS}\nRun: ${RUN_URL}"
          fi

          # Check current Notion Stage — skip if already in Fix/Implementing to avoid duplicates
          CURRENT_STAGE=$(curl -sf "https://api.notion.com/v1/pages/$PAGE_ID" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            | jq -r '.properties.Stage.select.name // ""' 2>/dev/null || echo "")
          if [[ "$CURRENT_STAGE" == "Fix" || "$CURRENT_STAGE" == "Implementing" ]]; then
            echo "Stage already '$CURRENT_STAGE' — skipping duplicate trigger."
            exit 0
          fi

          curl -sf -X PATCH "https://api.notion.com/v1/pages/$PAGE_ID" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d '{"properties": {"Stage": {"select": {"name": "Fix"}}}}'

          COMMENT_BODY=$(printf "Agent: notion-stage-sync\n%s workflow failure → Stage Fix\n\nPR #%s — failing jobs: %s\nRun: %s\n\nGATE4_CI_FAIL\n%s" \
            "$WORKFLOW_NAME" "$PR_NUMBER" "$FAILING_JOBS" "$RUN_URL" "$REVIEW_CONTEXT")

          jq -n --arg page_id "$PAGE_ID" --arg body "$COMMENT_BODY" \
            '{"parent":{"page_id":$page_id},"rich_text":[{"text":{"content":$body}}]}' \
          | curl -sf -X POST "https://api.notion.com/v1/comments" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d @-

          # Dispatch implementation agent DIRECTLY with reviewContext —
          # bypasses Notion webhook chain which loses reviewContext.
          FEATURE_BRANCH=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" --json headRefName -q .headRefName 2>/dev/null || echo "")

          FULL_REVIEW_CONTEXT=$(printf 'GATE4_CI_FAIL: %s\n%s\nFix ONLY the issues listed above. Run the relevant check locally before pushing.' \
            "$FAILING_JOBS" "$REVIEW_CONTEXT")

          DISPATCH_PAYLOAD=$(jq -n \
            --arg pageUrl "$NOTION_URL" \
            --arg featureBranch "$FEATURE_BRANCH" \
            --arg prNumber "$PR_NUMBER" \
            --arg reviewContext "$FULL_REVIEW_CONTEXT" \
            '{
              event_type: "implementation",
              client_payload: {
                pageUrl: $pageUrl,
                featureBranch: $featureBranch,
                prNumber: $prNumber,
                skipBugbot: "false",
                reviewContext: $reviewContext
              }
            }')

          curl -sf -X POST \
            "https://api.github.com/repos/eskobar95/mercflow-os/dispatches" \
            -H "Authorization: Bearer ${{ secrets.SYNC_GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$DISPATCH_PAYLOAD" && echo "Implementation agent dispatched with reviewContext" || true

          echo "Stage → Fix for PR #$PR_NUMBER ($NOTION_URL) — ${WORKFLOW_NAME} failed: $FAILING_JOBS"

  # ── 2. Bugbot findings → Stage: Fix ────────────────────────────────────────
  bugbot-fix:
    name: Stage → Fix on Bugbot findings
    runs-on: ubuntu-latest
    # Bugbot posts as cursor[bot] with COMMENTED state and <!-- BUGBOT_REVIEW --> marker.
    # We detect findings by the presence of <!-- BUGBOT_FIX_ALL --> in the body.
    if: >
      github.event_name == 'pull_request_review' &&
      github.event.review.user.login == 'cursor[bot]' &&
      contains(github.event.review.body, 'BUGBOT_FIX_ALL')
    steps:
      - name: Set Stage → Fix
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          PR_BODY=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json body -q .body)
          NOTION_URL=$(echo "$PR_BODY" | grep -oP 'https://www\.notion\.so/[a-zA-Z0-9/_-]+' | head -1 || true)
          [ -z "$NOTION_URL" ] && echo "No Notion URL in PR body — skipping." && exit 0

          HEX=$(echo "$NOTION_URL" | grep -oP '[0-9a-f]{32}' | tail -1)
          PAGE_ID="${HEX:0:8}-${HEX:8:4}-${HEX:12:4}-${HEX:16:4}-${HEX:20}"

          curl -sf -X PATCH "https://api.notion.com/v1/pages/$PAGE_ID" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d '{"properties": {"Stage": {"select": {"name": "Fix"}}}}'

          # Extract Bugbot summary (first 1500 chars of review body, stripped of HTML)
          BUGBOT_SUMMARY=$(echo '${{ toJson(github.event.review.body) }}' \
            | jq -r '.' | sed 's/<[^>]*>//g' | head -c 1500)

          curl -sf -X POST "https://api.notion.com/v1/comments" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{\"parent\":{\"page_id\":\"$PAGE_ID\"},\"rich_text\":[{\"text\":{\"content\":\"Agent: notion-stage-sync\nBugbot findings → Stage Fix\n\nPR #${PR_NUMBER} — Bugbot found issues. Implementation Agent dispatched.\n\nBugbot summary:\n${BUGBOT_SUMMARY}\"}}]}"

          echo "Stage → Fix for $NOTION_URL"

  # ── 3. Bugbot no findings → Stage: Ready for Merge ─────────────────────────
  bugbot-ready:
    name: Stage → Ready for Merge on Bugbot approval
    runs-on: ubuntu-latest
    # Bugbot posts BUGBOT_REVIEW but without BUGBOT_FIX_ALL when there are no findings.
    if: >
      github.event_name == 'pull_request_review' &&
      github.event.review.user.login == 'cursor[bot]' &&
      contains(github.event.review.body, 'BUGBOT_REVIEW') &&
      !contains(github.event.review.body, 'BUGBOT_FIX_ALL')
    steps:
      - name: Guard — CI must be green before Ready for Merge
        id: ci-guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Fetch all checks for this PR. Exclude internal notion-stage-sync checks.
          INTERNAL="Stage → Fix on CI/Security failure|Stage → Fix on Bugbot findings|Stage → Ready for Merge on Bugbot approval|Notion Stage Sync"

          CHECKS=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
            --json statusCheckRollup -q '.statusCheckRollup // []')

          FAILURES=$(echo "$CHECKS" | jq -r \
            '.[] | select(.conclusion == "FAILURE") | select(.name | test("'"$INTERNAL"'") | not) | .name')

          if [ -n "$FAILURES" ]; then
            echo "CI is NOT green — skipping Ready for Merge. Failing checks:"
            echo "$FAILURES"
            echo "ci_ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "CI is green — proceeding to Ready for Merge."
            echo "ci_ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Stage → Ready for Merge
        id: set-stage
        if: steps.ci-guard.outputs.ci_ok == 'true'
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          PR_BODY=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json body -q .body)
          NOTION_URL=$(echo "$PR_BODY" | grep -oP 'https://www\.notion\.so/[a-zA-Z0-9/_-]+' | head -1 || true)
          [ -z "$NOTION_URL" ] && echo "No Notion URL in PR body — skipping." && exit 0

          HEX=$(echo "$NOTION_URL" | grep -oP '[0-9a-f]{32}' | tail -1)
          PAGE_ID="${HEX:0:8}-${HEX:8:4}-${HEX:12:4}-${HEX:16:4}-${HEX:20}"

          curl -sf -X PATCH "https://api.notion.com/v1/pages/$PAGE_ID" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d '{"properties": {"Stage": {"select": {"name": "Ready for Merge"}}}}'

          curl -sf -X POST "https://api.notion.com/v1/comments" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{\"parent\":{\"page_id\":\"$PAGE_ID\"},\"rich_text\":[{\"text\":{\"content\":\"Agent: notion-stage-sync\nBugbot: no findings → Stage Ready for Merge\n\nPR #${PR_NUMBER} passed Bugbot review. CI confirmed green. Tech Lead Merge Agent dispatched.\"}}]}"

          echo "notion_url=$NOTION_URL" >> "$GITHUB_OUTPUT"
          echo "Stage → Ready for Merge for $NOTION_URL"

      - name: Dispatch merge agent
        if: steps.set-stage.outputs.notion_url != ''
        env:
          GH_TOKEN: ${{ secrets.SYNC_GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NOTION_URL: ${{ steps.set-stage.outputs.notion_url }}
        run: |
          set -euo pipefail

          FEATURE_BRANCH=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName -q .headRefName)

          curl -sf -X POST \
            "https://api.github.com/repos/eskobar95/mercflow-os/dispatches" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"event_type\":\"pr-ready-to-merge\",\"client_payload\":{\"pageUrl\":\"$NOTION_URL\",\"featureBranch\":\"$FEATURE_BRANCH\",\"prNumber\":\"$PR_NUMBER\"}}"

          echo "Dispatched pr-ready-to-merge for PR #$PR_NUMBER branch=$FEATURE_BRANCH"

  # ── Cron fallback: catch PRs stuck in Bugbot stage ──────────────────────────
  # The pull_request_review event is unreliable — we've seen Bugbot reviews that
  # never triggered the webhook. This job runs every 15 min and picks up any PR
  # that remains at Stage=Bugbot despite having a cursor[bot] review with
  # BUGBOT_FIX_ALL. It sets Stage→Fix and dispatches the implementation event
  # directly, bypassing the Notion automation entirely.
  bugbot-stuck-fallback:
    name: Bugbot stuck fallback (cron)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Scan open PRs for stuck Bugbot stage
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GH_TOKEN: ${{ secrets.SYNC_GITHUB_TOKEN }}
        run: |
          echo "=== Bugbot stuck fallback — $(date -u) ==="

          OPEN_PRS=$(gh pr list \
            --repo eskobar95/mercflow \
            --state open \
            --json number,body \
            --limit 50 2>/dev/null || echo "[]")

          PR_COUNT=$(echo "$OPEN_PRS" | jq 'length')
          echo "Open PRs found: $PR_COUNT"

          echo "$OPEN_PRS" | jq -c '.[]' | while IFS= read -r PR; do
            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            PR_BODY=$(echo "$PR" | jq -r '.body // ""')

            # Extract Notion URL from PR body
            NOTION_URL=$(echo "$PR_BODY" \
              | grep -oP 'https://www\.notion\.so/[a-zA-Z0-9/_-]+' \
              | head -1 || true)
            if [ -z "$NOTION_URL" ]; then
              echo "PR #$PR_NUMBER — no Notion URL, skipping"
              continue
            fi

            # Extract 32-char hex page ID and format as UUID
            HEX=$(echo "$NOTION_URL" | grep -oP '[0-9a-f]{32}' | tail -1 || true)
            if [ -z "$HEX" ]; then
              echo "PR #$PR_NUMBER — cannot extract page ID from $NOTION_URL, skipping"
              continue
            fi
            PAGE_ID="${HEX:0:8}-${HEX:8:4}-${HEX:12:4}-${HEX:16:4}-${HEX:20}"

            # Fetch current Notion Stage for this task
            PAGE=$(curl -sf "https://api.notion.com/v1/pages/$PAGE_ID" \
              -H "Authorization: Bearer $NOTION_API_KEY" \
              -H "Notion-Version: 2022-06-28" 2>/dev/null || echo "{}")
            STAGE=$(echo "$PAGE" | jq -r '.properties.Stage.select.name // ""')

            echo "PR #$PR_NUMBER — Notion Stage='$STAGE' ($NOTION_URL)"

            if [ "$STAGE" != "Bugbot" ]; then
              continue
            fi

            echo "PR #$PR_NUMBER — Stage=Bugbot, checking for stuck cursor[bot] review..."

            # Fetch PR reviews and look for cursor[bot] with BUGBOT_FIX_ALL marker
            REVIEWS_JSON=$(gh api \
              "repos/eskobar95/mercflow/pulls/${PR_NUMBER}/reviews" \
              2>/dev/null || echo "[]")

            BUGBOT_REVIEW=$(echo "$REVIEWS_JSON" | jq -r \
              '[.[] | select(.user.login == "cursor[bot]") | select((.body // "") | contains("BUGBOT_FIX_ALL"))][0] // "null"')

            if [ "$BUGBOT_REVIEW" = "null" ]; then
              echo "PR #$PR_NUMBER — no cursor[bot] review with BUGBOT_FIX_ALL, skipping"
              continue
            fi

            echo "PR #$PR_NUMBER — BUGBOT_FIX_ALL confirmed. Setting Stage → Fix..."

            # Set Stage → Fix in Notion. The Notion webhook automation will detect this
            # change and dispatch the implementation agent — no direct dispatch needed here.
            curl -sf -X PATCH "https://api.notion.com/v1/pages/$PAGE_ID" \
              -H "Authorization: Bearer $NOTION_API_KEY" \
              -H "Notion-Version: 2022-06-28" \
              -H "Content-Type: application/json" \
              -d '{"properties":{"Stage":{"select":{"name":"Fix"}}}}' > /dev/null || true

            # Post audit comment to Notion task
            curl -sf -X POST "https://api.notion.com/v1/comments" \
              -H "Authorization: Bearer $NOTION_API_KEY" \
              -H "Notion-Version: 2022-06-28" \
              -H "Content-Type: application/json" \
              -d "{\"parent\":{\"page_id\":\"$PAGE_ID\"},\"rich_text\":[{\"text\":{\"content\":\"Agent: notion-stage-sync (cron fallback)\nBugbot stuck fallback triggered\n\nPR #${PR_NUMBER} was stuck at Stage=Bugbot — the pull_request_review event likely did not fire. Found cursor[bot] review with BUGBOT_FIX_ALL.\n\nStage set to Fix. Notion webhook automation will dispatch the Implementation Agent.\"}}]}" > /dev/null || true

            echo "PR #$PR_NUMBER — DONE: Stage → Fix (Notion webhook handles dispatch)"
          done

          echo "=== Bugbot stuck fallback complete ==="
