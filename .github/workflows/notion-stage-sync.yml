name: Notion Stage Sync

# Sets Notion task Stage → Fix when a code-quality CI check fails on a PR.
# The notion-webhook worker picks up the Stage change and re-dispatches the
# implementation agent to fix the failing check.
#
# Only reacts to code-quality checks — never infra or security checks.
# Infra failures (Backend, Playwright) route to /devops-check instead.

on:
  check_run:
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  sync-stage-fix:
    name: Stage → Fix on code-quality failure
    runs-on: ubuntu-latest

    # Only run when a named code-quality check fails
    if: >
      github.event.check_run.conclusion == 'failure' &&
      (
        github.event.check_run.name == 'React Doctor (admin-ui)' ||
        github.event.check_run.name == 'Lint, test, typecheck, build'
      )

    steps:
      - name: Set Notion Stage → Fix
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_NAME: ${{ github.event.check_run.name }}
        run: |
          set -euo pipefail

          # ── 1. Find PR number from check run ─────────────────────────────────
          PR_NUMBER=$(echo '${{ toJson(github.event.check_run.pull_requests) }}' \
            | jq -r '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR associated with this check run — skipping."
            exit 0
          fi

          echo "PR: #$PR_NUMBER  Check: $CHECK_NAME"

          # ── 2. Get Notion task URL from PR body ───────────────────────────────
          PR_BODY=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json body -q .body)

          NOTION_URL=$(echo "$PR_BODY" \
            | grep -oP 'https://www\.notion\.so/[a-zA-Z0-9/_-]+' \
            | head -1 || true)

          if [ -z "$NOTION_URL" ]; then
            echo "No Notion URL found in PR body — skipping."
            exit 0
          fi

          echo "Notion task: $NOTION_URL"

          # ── 3. Format page ID (32-char hex → UUID) ───────────────────────────
          HEX=$(echo "$NOTION_URL" | grep -oP '[0-9a-f]{32}' | tail -1)
          PAGE_ID="${HEX:0:8}-${HEX:8:4}-${HEX:12:4}-${HEX:16:4}-${HEX:20}"

          # ── 4. Set Stage → Fix ────────────────────────────────────────────────
          PATCH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH "https://api.notion.com/v1/pages/$PAGE_ID" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d '{"properties": {"Stage": {"select": {"name": "Fix"}}}}')

          echo "Notion PATCH status: $PATCH_STATUS"

          # ── 5. Post comment with context for the implementation agent ─────────
          COMMENT_TEXT="Agent: github-events (GH Actions)\nCI code-quality failure → Stage Fix\n\nFailing check on PR #${PR_NUMBER}: ${CHECK_NAME}\n\nImplementation Agent dispatched. Fix only this check failure — no scope changes."

          curl -s -X POST "https://api.notion.com/v1/comments" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{
              \"parent\": {\"page_id\": \"$PAGE_ID\"},
              \"rich_text\": [{\"text\": {\"content\": \"$COMMENT_TEXT\"}}]
            }"

          echo "Done — Stage set to Fix."
