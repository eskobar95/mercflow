# Managed by Conduro - do not edit manually
name: Conduro CI
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  conduro-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: React Doctor
        run: npx react-doctor@latest --json --diff --offline > /tmp/react-doctor.json || true
      - name: Semgrep
        run: |
          pip install semgrep -q
          semgrep scan \
            --config p/typescript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --config p/react \
            --baseline-commit "${{ github.event.pull_request.base.sha }}" \
            --json --output /tmp/semgrep.json \
            . || true
      - name: Socket.dev
        run: npx @socketsecurity/cli@latest pnpm audit --json > /tmp/socket.json || echo '{"issues":[]}' > /tmp/socket.json
      - name: Report to Conduro
        run: |
          npx @conduro/ci-reporter@1.0.1 \
            --react-doctor /tmp/react-doctor.json \
            --semgrep /tmp/semgrep.json \
            --socket /tmp/socket.json \
            --pr-number ${{ github.event.pull_request.number }} \
            --commit-sha ${{ github.event.pull_request.head.sha }} \
            --repo ${{ github.repository }}
        env:
          CONDURO_API_KEY: ${{ secrets.CONDURO_API_KEY }}
          CONDURO_WORKER_URL: ${{ vars.CONDURO_WORKER_URL }}
