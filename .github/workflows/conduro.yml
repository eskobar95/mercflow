# Managed by Conduro - do not edit manually
name: Conduro CI
on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: conduro-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install @conduro/ci-reporter
        run: |
          if npm view @conduro/ci-reporter@1.0.2 version >/dev/null 2>&1; then
            echo "CONDURO_REPORTER=npx --yes @conduro/ci-reporter@1.0.2" >> "$GITHUB_ENV"
          else
            echo "CONDURO_REPORTER=node ${GITHUB_WORKSPACE}/.github/conduro/ci-reporter/dist/index.js" >> "$GITHUB_ENV"
          fi
      - name: Scan
        run: |
          npx react-doctor@latest --json --diff --offline > react-doctor.json || true
          test -s react-doctor.json || echo "{}" > react-doctor.json
      - name: Gate (blocking findings)
        run: ${{ env.CONDURO_REPORTER }} gate --react-doctor react-doctor.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-doctor
          path: react-doctor.json
          retention-days: 1

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install @conduro/ci-reporter
        run: |
          if npm view @conduro/ci-reporter@1.0.2 version >/dev/null 2>&1; then
            echo "CONDURO_REPORTER=npx --yes @conduro/ci-reporter@1.0.2" >> "$GITHUB_ENV"
          else
            echo "CONDURO_REPORTER=node ${GITHUB_WORKSPACE}/.github/conduro/ci-reporter/dist/index.js" >> "$GITHUB_ENV"
          fi
      - name: Scan
        run: |
          pip install semgrep -q
          semgrep scan \
            --config p/typescript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --config p/react \
            --baseline-commit "${{ github.event.pull_request.base.sha }}" \
            --json --output semgrep.json \
            . || true
          test -s semgrep.json || echo '{"results":[]}' > semgrep.json
      - name: Gate (blocking findings)
        run: ${{ env.CONDURO_REPORTER }} gate --semgrep semgrep.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep
          path: semgrep.json
          retention-days: 1

  socket:
    name: Socket (supply chain)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install @conduro/ci-reporter
        run: |
          if npm view @conduro/ci-reporter@1.0.2 version >/dev/null 2>&1; then
            echo "CONDURO_REPORTER=npx --yes @conduro/ci-reporter@1.0.2" >> "$GITHUB_ENV"
          else
            echo "CONDURO_REPORTER=node ${GITHUB_WORKSPACE}/.github/conduro/ci-reporter/dist/index.js" >> "$GITHUB_ENV"
          fi
      - name: Scan
        run: |
          npx @socketsecurity/cli@latest pnpm audit --json > socket.json || true
          test -s socket.json || echo '{"issues":[]}' > socket.json
      - name: Gate (blocking findings)
        run: ${{ env.CONDURO_REPORTER }} gate --socket socket.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: socket
          path: socket.json
          retention-days: 1

  report:
    name: Conduro report
    runs-on: ubuntu-latest
    needs: [react-doctor, semgrep, socket]
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: findings
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install @conduro/ci-reporter
        run: |
          if npm view @conduro/ci-reporter@1.0.2 version >/dev/null 2>&1; then
            echo "CONDURO_REPORTER=npx --yes @conduro/ci-reporter@1.0.2" >> "$GITHUB_ENV"
          else
            echo "CONDURO_REPORTER=node ${GITHUB_WORKSPACE}/.github/conduro/ci-reporter/dist/index.js" >> "$GITHUB_ENV"
          fi
      - name: Prepare finding files
        run: |
          cp findings/react-doctor/react-doctor.json /tmp/react-doctor.json 2>/dev/null || echo "{}" > /tmp/react-doctor.json
          cp findings/semgrep/semgrep.json /tmp/semgrep.json 2>/dev/null || echo '{"results":[]}' > /tmp/semgrep.json
          cp findings/socket/socket.json /tmp/socket.json 2>/dev/null || echo '{"issues":[]}' > /tmp/socket.json
      - name: Report to Conduro
        run: |
          ${{ env.CONDURO_REPORTER }} \
            --react-doctor /tmp/react-doctor.json \
            --semgrep /tmp/semgrep.json \
            --socket /tmp/socket.json \
            --pr-number ${{ github.event.pull_request.number }} \
            --commit-sha ${{ github.event.pull_request.head.sha }} \
            --repo ${{ github.repository }}
        env:
          CONDURO_API_KEY: ${{ secrets.CONDURO_API_KEY }}
          CONDURO_WORKER_URL: ${{ vars.CONDURO_WORKER_URL }}
