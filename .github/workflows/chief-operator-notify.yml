name: Chief Operator notify

on:
  workflow_run:
    workflows:
      - CI
      - Security
    types:
      - completed

permissions: {}

jobs:
  notify-chief-operator:
    name: Notify Chief Operator
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: POST workflow completion to Chief Operator
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.CHIEF_OPERATOR_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.CHIEF_OPERATOR_WEBHOOK_SECRET }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PRS_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          if [[ -z "${WEBHOOK_URL}" || -z "${WEBHOOK_SECRET}" ]]; then
            echo "::notice::Chief Operator webhook skipped — CHIEF_OPERATOR_WEBHOOK_URL or CHIEF_OPERATOR_WEBHOOK_SECRET is not configured."
            exit 0
          fi

          PRS="${PRS_JSON}"
          if [[ "${PRS}" == "null" || -z "${PRS}" ]]; then
            PRS='[]'
          fi

          if ! echo "${PRS}" | jq -e . >/dev/null 2>&1; then
            echo "::notice title=Chief Operator::Could not parse workflow_run.pull_requests; sending payload without pr_number."
            PRS='[]'
          fi

          PR_NUMBER="$(echo "${PRS}" | jq -r 'if type == "array" and length > 0 then .[0].number else empty end')"

          if [[ -n "${PR_NUMBER}" ]]; then
            BODY="$(jq -n \
              --arg event "workflow_run" \
              --arg workflow "${WF_NAME}" \
              --arg conclusion "${WF_CONCLUSION}" \
              --argjson pr_number "${PR_NUMBER}" \
              '{event: $event, pr_number: $pr_number, workflow: $workflow, conclusion: $conclusion}')"
          else
            BODY="$(jq -n \
              --arg event "workflow_run" \
              --arg workflow "${WF_NAME}" \
              --arg conclusion "${WF_CONCLUSION}" \
              '{event: $event, workflow: $workflow, conclusion: $conclusion}')"
          fi

          if ! curl -sS -f -o /dev/null \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: ${WEBHOOK_SECRET}" \
            -d "${BODY}" \
            "${WEBHOOK_URL}"; then
            echo "::notice title=Chief Operator::Webhook POST did not return success — continuing without failing the workflow."
          fi
